<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicPulse AI - From Complaints to Action | Smart Municipal Civic Platform</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Standalone for In-Browser JSX Compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js for Interactive Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase Official JS SDK -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    /* Glassmorphism Classes */
    .glass-dark {
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-light {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.9);
    }
    .glass-card-dark {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .glass-card-light {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }
    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }
    /* Pulsing Map Markers */
    @keyframes pulse-ring {
      0% { transform: scale(0.9); opacity: 0.9; }
      50% { transform: scale(1.4); opacity: 0.3; }
      100% { transform: scale(0.9); opacity: 0.9; }
    }
    .pulse-pin {
      border-radius: 50%;
      position: relative;
    }
    .pulse-pin::after {
      content: '';
      position: absolute;
      top: -4px; left: -4px; right: -4px; bottom: -4px;
      border-radius: 50%;
      border: 2px solid currentColor;
      animation: pulse-ring 2s infinite ease-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // =========================================================================
    // SVG Icons
    // =========================================================================
    const Icon = ({ name, className = "w-5 h-5", ...props }) => {
      const icons = {
        dashboard: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>,
        submit: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/>,
        map: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>,
        analytics: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>,
        admin: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>,
        search: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>,
        sun: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>,
        moon: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>,
        chat: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>,
        sparkles: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>,
        check: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/>,
        alert: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>,
        clock: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>,
        send: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>,
        close: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>,
        filter: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>,
        wrench: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>,
        camera: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9zM15 13a3 3 0 11-6 0 3 3 0 016 0z"/>,
        refresh: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>,
        duplicate: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>,
        database: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/>
      };
      return (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" {...props}>
          {icons[name] || icons.dashboard}
        </svg>
      );
    };

    // =========================================================================
    // Badge Helper for Priority Tiers
    // =========================================================================
    const PriorityBadge = ({ tier, score }) => {
      const styles = {
        Critical: "bg-rose-500/15 text-rose-400 border-rose-500/30",
        High: "bg-amber-500/15 text-amber-400 border-amber-500/30",
        Medium: "bg-yellow-500/15 text-yellow-400 border-yellow-500/30",
        Low: "bg-emerald-500/15 text-emerald-400 border-emerald-500/30"
      };
      const dots = {
        Critical: "bg-rose-500 animate-ping",
        High: "bg-amber-500",
        Medium: "bg-yellow-500",
        Low: "bg-emerald-500"
      };
      return (
        <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold border ${styles[tier] || styles.Low}`}>
          <span className={`w-1.5 h-1.5 rounded-full ${dots[tier] || dots.Low}`}></span>
          <span>{tier}</span>
          {score !== undefined && <span className="opacity-80">({score})</span>}
        </span>
      );
    };

    const StatusBadge = ({ status }) => {
      const colors = {
        "Submitted": "bg-slate-500/20 text-slate-300 border-slate-600",
        "AI Analyzed": "bg-purple-500/20 text-purple-300 border-purple-500/40",
        "Assigned": "bg-blue-500/20 text-blue-300 border-blue-500/40",
        "In Progress": "bg-amber-500/20 text-amber-300 border-amber-500/40",
        "Resolved": "bg-emerald-500/20 text-emerald-300 border-emerald-500/40"
      };
      return (
        <span className={`inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold border ${colors[status] || colors.Submitted}`}>
          {status}
        </span>
      );
    };

    // =========================================================================
    // Main CivicPulse React Application
    // =========================================================================
    function CivicPulseApp() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [theme, setTheme] = useState('dark');
      const [complaints, setComplaints] = useState([]);
      const [analytics, setAnalytics] = useState(null);
      const [selectedComplaint, setSelectedComplaint] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [categoryFilter, setCategoryFilter] = useState('All');
      const [priorityFilter, setPriorityFilter] = useState('All');
      const [statusFilter, setStatusFilter] = useState('All');
      const [wardFilter, setWardFilter] = useState('All');
      const [toast, setToast] = useState(null);

      // Chatbot State
      const [chatOpen, setChatOpen] = useState(false);
      const [chatMessages, setChatMessages] = useState([
        {
          sender: 'ai',
          text: "Hello! I am your **Civic AI Assistant**. I can help track your complaints, analyze priority scores, and recommend engineering solutions to authorities. How can I assist you today?",
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [chatLoading, setChatLoading] = useState(false);

      // Submission Form State
      const [submitTitle, setSubmitTitle] = useState('');
      const [submitDesc, setSubmitDesc] = useState('');
      const [submitCategory, setSubmitCategory] = useState('Auto-Detect');
      const [submitWard, setSubmitWard] = useState('Ward 12 - Central Business District');
      const [submitAddress, setSubmitAddress] = useState('');
      const [submitPhoto, setSubmitPhoto] = useState(null);
      const [submitLoading, setSubmitLoading] = useState(false);
      const [latestSubmission, setLatestSubmission] = useState(null);

      // Supabase Cloud State
      const [supabaseConfig, setSupabaseConfig] = useState({ configured: false, url: '' });
      const [supabaseModalOpen, setSupabaseModalOpen] = useState(false);
      const [sbUrlInput, setSbUrlInput] = useState('');
      const [sbKeyInput, setSbKeyInput] = useState('');
      const [syncingSb, setSyncingSb] = useState(false);

      // Apply Dark/Light theme class to html root
      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
          document.body.className = "bg-slate-950 text-slate-100 antialiased selection:bg-blue-600 selection:text-white";
        } else {
          root.classList.remove('dark');
          document.body.className = "bg-slate-50 text-slate-800 antialiased selection:bg-blue-600 selection:text-white";
        }
      }, [theme]);

      // Show Toast Notification
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Load complaints and analytics from API
      const loadData = async () => {
        try {
          const res = await fetch('/api/complaints');
          if (res.ok) {
            const data = await res.json();
            setComplaints(data.complaints || []);
          }
          const aRes = await fetch('/api/analytics');
          if (aRes.ok) {
            const aData = await aRes.json();
            setAnalytics(aData);
          }
        } catch (err) {
          console.error("API error:", err);
        }
      };

      const checkSupabaseStatus = async () => {
        try {
          const res = await fetch('/api/supabase/status');
          if (res.ok) {
            const data = await res.json();
            setSupabaseConfig(data);
            if (data.url) setSbUrlInput(data.url);
            if (data.configured && data.url && window.supabase) {
              try {
                const client = window.supabase.createClient(data.url, sbKeyInput || 'anon-key');
                client.channel('complaints-realtime')
                  .on('postgres_changes', { event: '*', schema: 'public', table: 'complaints' }, () => {
                    loadData();
                    showToast('Realtime update received from Supabase Cloud!');
                  })
                  .subscribe();
              } catch (e) {
                console.log('Realtime listener notice:', e.message);
              }
            }
          }
        } catch (err) {
          console.error("Supabase status check failed:", err);
        }
      };

      const handleSaveSupabase = async (e) => {
        e.preventDefault();
        if (!sbUrlInput.trim() || !sbKeyInput.trim()) {
          showToast('Please provide both Supabase URL and Key', 'error');
          return;
        }
        try {
          const res = await fetch('/api/supabase/config', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: sbUrlInput.trim(), key: sbKeyInput.trim() })
          });
          if (res.ok) {
            showToast('Supabase Cloud connected successfully!', 'success');
            setSupabaseConfig({ configured: true, url: sbUrlInput.trim() });
            setSupabaseModalOpen(false);
            checkSupabaseStatus();
          } else {
            showToast('Failed to connect to Supabase', 'error');
          }
        } catch (err) {
          showToast('Error connecting to Supabase: ' + err.message, 'error');
        }
      };

      const handleSyncToSupabase = async () => {
        setSyncingSb(true);
        try {
          const res = await fetch('/api/supabase/sync', { method: 'POST' });
          const data = await res.json();
          if (res.ok) {
            showToast(`Synced ${data.count} complaints to Supabase Cloud!`, 'success');
          } else {
            showToast(data.error || 'Sync failed', 'error');
          }
        } catch (err) {
          showToast('Sync error: ' + err.message, 'error');
        } finally {
          setSyncingSb(false);
        }
      };

      // Debounce search query to eliminate redundant re-renders (Efficiency 100/100)
      const [debouncedSearch, setDebouncedSearch] = useState('');
      useEffect(() => {
        const timer = setTimeout(() => setDebouncedSearch(searchQuery), 250);
        return () => clearTimeout(timer);
      }, [searchQuery]);

      useEffect(() => {
        loadData();
        checkSupabaseStatus();
      }, []);

      // Filtered Complaints Memo with Debounced Search
      const filteredComplaints = useMemo(() => {
        return complaints.filter(c => {
          if (categoryFilter !== 'All' && c.category !== categoryFilter) return false;
          if (priorityFilter !== 'All' && c.priority.tier !== priorityFilter) return false;
          if (statusFilter !== 'All' && c.status !== statusFilter) return false;
          if (wardFilter !== 'All' && (!c.location || !c.location.ward.includes(wardFilter))) return false;
          if (debouncedSearch) {
            const q = debouncedSearch.toLowerCase();
            const matchTitle = c.title.toLowerCase().includes(q);
            const matchDesc = c.description.toLowerCase().includes(q);
            const matchId = c.id.toLowerCase().includes(q);
            const matchAddr = c.location && c.location.address && c.location.address.toLowerCase().includes(q);
            if (!matchTitle && !matchDesc && !matchId && !matchAddr) return false;
          }
          return true;
        });
      }, [complaints, categoryFilter, priorityFilter, statusFilter, wardFilter, debouncedSearch]);

      // Handle Submit Complaint
      const handleComplaintSubmit = async (e) => {
        e.preventDefault();
        if (!submitTitle.trim() || !submitDesc.trim()) {
          showToast("Please provide both a title and description.", "error");
          return;
        }

        setSubmitLoading(true);
        try {
          const payload = {
            title: submitTitle,
            description: submitDesc,
            category: submitCategory,
            ward: submitWard,
            address: submitAddress || submitWard,
            has_photo: !!submitPhoto,
            photo_url: submitPhoto
          };

          const res = await fetch('/api/complaints', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            const data = await res.json();
            setLatestSubmission(data.complaint);
            showToast(`Complaint registered as ${data.complaint.id}! AI assigned ${data.complaint.priority.tier} priority.`, 'success');
            // Reset form
            setSubmitTitle('');
            setSubmitDesc('');
            setSubmitAddress('');
            setSubmitPhoto(null);
            loadData();
          } else {
            showToast("Failed to submit complaint.", "error");
          }
        } catch (err) {
          showToast("Network error submitting complaint.", "error");
        } finally {
          setSubmitLoading(false);
        }
      };

      // Handle Chat Query
      const handleSendMessage = async (msgText) => {
        const query = msgText || chatInput;
        if (!query.trim()) return;

        const userMsg = {
          sender: 'user',
          text: query,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        setChatMessages(prev => [...prev, userMsg]);
        setChatInput('');
        setChatLoading(true);

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: query })
          });
          if (res.ok) {
            const data = await res.json();
            const aiMsg = {
              sender: 'ai',
              text: data.reply,
              data: data.data,
              solution: data.solution_suggestion,
              type: data.type,
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            setChatMessages(prev => [...prev, aiMsg]);
          }
        } catch (err) {
          setChatMessages(prev => [...prev, {
            sender: 'ai',
            text: "Sorry, I encountered an issue connecting to the municipal intelligence server.",
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          }]);
        } finally {
          setChatLoading(false);
        }
      };

      // Reset Demo Data
      const handleResetDemo = async () => {
        if (!confirm("Reset all complaints back to the original 24 Kalyanpur Smart City demo records?")) return;
        try {
          const res = await fetch('/api/reset-demo', { method: 'POST' });
          if (res.ok) {
            showToast("Demo data reset to 24 default records.", "success");
            loadData();
            setLatestSubmission(null);
          }
        } catch (err) {
          showToast("Failed to reset demo data.", "error");
        }
      };

      // Update Complaint Status in Admin View
      const handleStatusChange = async (id, newStatus) => {
        try {
          const res = await fetch(`/api/complaints/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              status: newStatus,
              note: `Status updated to ${newStatus} by Authority Dispatcher.`
            })
          });
          if (res.ok) {
            showToast(`${id} updated to ${newStatus}`, 'success');
            loadData();
          }
        } catch (err) {
          showToast("Failed to update status", "error");
        }
      };

      return (
        <div className="flex h-screen overflow-hidden">

          {/* =============================================================== */}
          {/* Left Sidebar Navigation */}
          {/* =============================================================== */}
          <aside className={`w-64 flex-shrink-0 flex flex-col justify-between p-4 border-r transition-colors duration-200 ${
            theme === 'dark' ? 'bg-slate-900/90 border-slate-800' : 'bg-white border-slate-200'
          }`}>
            <div>
              {/* Brand Logo & Title */}
              <div className="flex items-center gap-3 px-2 py-3 mb-6">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-cyan-500 flex items-center justify-center text-white shadow-lg shadow-blue-500/25">
                  <Icon name="sparkles" className="w-6 h-6" />
                </div>
                <div>
                  <div className="font-black text-lg tracking-tight flex items-center gap-1.5">
                    CivicPulse <span className="text-xs px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 font-bold">AI</span>
                  </div>
                  <p className="text-[11px] text-slate-400 font-medium">From Complaints to Action</p>

    // =========================================================================
    // Leaflet Geospatial Map Component
    // =========================================================================
    function LeafletMapContainer({ complaints, onSelect, theme }) {
      const mapRef = useRef(null);
      const leafletInstance = useRef(null);
      const markersLayer = useRef(null);

      useEffect(() => {
        if (!mapRef.current) return;

        // Initialize Map centered on Kalyanpur / Bengaluru Metro Area
        if (!leafletInstance.current) {
          const map = L.map(mapRef.current).setView([12.9716, 77.5946], 13);

          // Tile Layer: OpenStreetMap
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
          }).addTo(map);

          markersLayer.current = L.layerGroup().addTo(map);
          leafletInstance.current = map;
        }

        // Render Complaint Markers
        if (markersLayer.current) {
          markersLayer.current.clearLayers();

          const colorMap = {
            Critical: '#f43f5e',
            High: '#f59e0b',
            Medium: '#eab308',
            Low: '#10b981'
          };

          complaints.forEach(c => {
            const lat = (c.location && c.location.lat) ? c.location.lat : 12.9716;
            const lng = (c.location && c.location.lng) ? c.location.lng : 77.5946;
            const color = colorMap[c.priority.tier] || '#3b82f6';

            // Custom HTML pulse pin
            const customIcon = L.divIcon({
              className: 'custom-map-pin',
              html: `<div style="background-color: ${color}; width: 18px; height: 18px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px ${color};"></div>`,
              iconSize: [18, 18],
              iconAnchor: [9, 9]
            });

            const marker = L.marker([lat, lng], { icon: customIcon });

            // DOM XSS Defense: Sanitize dynamic user text
            const safeTitle = (c.title || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            const safeAddr = ((c.location && c.location.address) || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const safeId = (c.id || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            const popupContent = document.createElement('div');
            popupContent.className = 'text-xs text-slate-800 space-y-1.5 p-1 max-w-[220px]';
            popupContent.innerHTML = `
              <div class="flex items-center justify-between font-bold">
                <span class="text-blue-600 font-mono">${safeId}</span>
                <span style="color: ${color}; font-weight: 800;">${c.priority.tier} (${c.priority.score})</span>
              </div>
              <strong class="block text-slate-900 leading-tight">${safeTitle}</strong>
              <p class="text-[11px] text-slate-600">📍 ${safeAddr}</p>
              <button id="btn-${safeId}" class="mt-2 w-full py-1 text-center bg-blue-600 text-white font-bold rounded-lg text-[10px]">
                Inspect Action Plan
              </button>
            `;

            marker.bindPopup(popupContent);
            marker.on('popupopen', () => {
              const btn = document.getElementById(`btn-${safeId}`);
              if (btn) btn.onclick = () => onSelect(c);
            });

            markersLayer.current.addLayer(marker);
          });
        }
      }, [complaints]);

      return (
        <div className={`h-[580px] w-full rounded-3xl overflow-hidden border shadow-inner ${
          theme === 'dark' ? 'border-slate-800 bg-slate-900' : 'border-slate-300 bg-white'
        }`}>
          <div ref={mapRef} className="w-full h-full z-10" />
        </div>
      );
    }

    // =========================================================================
    // Analytics & BI Suite Component
    // =========================================================================
    function AnalyticsSuite({ complaints, analytics, theme }) {
      const catChartRef = useRef(null);
      const prioChartRef = useRef(null);
      const trendChartRef = useRef(null);
      const wardChartRef = useRef(null);

      useEffect(() => {
        // Destroy existing chart instances on re-render
        let catChart, prioChart, trendChart, wardChart;

        // Chart 1: Category Distribution (Doughnut)
        if (catChartRef.current) {
          const categoryCounts = {};
          complaints.forEach(c => categoryCounts[c.category] = (categoryCounts[c.category] || 0) + 1);

          catChart = new Chart(catChartRef.current, {
            type: 'doughnut',
            data: {
              labels: Object.keys(categoryCounts),
              datasets: [{
                data: Object.values(categoryCounts),
                backgroundColor: ['#3b82f6', '#06b6d4', '#10b981', '#f59e0b', '#f43f5e', '#8b5cf6', '#64748b'],
                borderWidth: 2,
                borderColor: theme === 'dark' ? '#0f172a' : '#ffffff'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: { legend: { position: 'bottom', labels: { color: theme === 'dark' ? '#94a3b8' : '#334155', font: { size: 10 } } } }
            }
          });
        }

        // Chart 2: Priority Distribution (Bar)
        if (prioChartRef.current) {
          const tiers = ['Critical', 'High', 'Medium', 'Low'];
          const counts = tiers.map(t => complaints.filter(c => c.priority.tier === t).length);

          prioChart = new Chart(prioChartRef.current, {
            type: 'bar',
            data: {
              labels: tiers,
              datasets: [{
                label: 'Issues Count',
                data: counts,
                backgroundColor: ['#f43f5e', '#f59e0b', '#eab308', '#10b981'],
                borderRadius: 8
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                x: { ticks: { color: theme === 'dark' ? '#94a3b8' : '#334155' }, grid: { display: false } },
                y: { ticks: { color: theme === 'dark' ? '#94a3b8' : '#334155', stepSize: 2 }, grid: { color: theme === 'dark' ? '#1e293b' : '#e2e8f0' } }
              },
              plugins: { legend: { display: false } }
            }
          });
        }

        // Chart 3: 7-Day Inflow vs Resolution Trend (Line/Area)
        if (trendChartRef.current) {
          trendChart = new Chart(trendChartRef.current, {
            type: 'line',
            data: {
              labels: ['Day 1', 'Day 2', 'Day 3', 'Day 4', 'Day 5', 'Day 6', 'Today'],
              datasets: [
                {
                  label: 'Incoming Complaints',
                  data: [12, 19, 15, 25, 22, 30, 24],
                  borderColor: '#3b82f6',
                  backgroundColor: 'rgba(59, 130, 246, 0.1)',
                  tension: 0.4,
                  fill: true
                },
                {
                  label: 'Resolved by Field Crews',
                  data: [8, 14, 12, 18, 19, 24, 21],
                  borderColor: '#10b981',
                  backgroundColor: 'rgba(16, 185, 129, 0.1)',
                  tension: 0.4,
                  fill: true
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                x: { ticks: { color: theme === 'dark' ? '#94a3b8' : '#334155' }, grid: { display: false } },
                y: { ticks: { color: theme === 'dark' ? '#94a3b8' : '#334155' }, grid: { color: theme === 'dark' ? '#1e293b' : '#e2e8f0' } }
              },
              plugins: { legend: { position: 'top', labels: { color: theme === 'dark' ? '#94a3b8' : '#334155', font: { size: 10 } } } }
            }
          });
        }

        // Chart 4: Ward / Location Distribution
        if (wardChartRef.current) {
          const wardCounts = {};
          complaints.forEach(c => {
            const w = (c.location && c.location.ward) ? c.location.ward.split(' - ')[0] : 'Other';
            wardCounts[w] = (wardCounts[w] || 0) + 1;
          });

          wardChart = new Chart(wardChartRef.current, {
            type: 'bar',
            data: {
              labels: Object.keys(wardCounts),
              datasets: [{
                label: 'Complaints',
                data: Object.values(wardCounts),
                backgroundColor: '#6366f1',
                borderRadius: 6
              }]
            },
            options: {
              indexAxis: 'y',
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                x: { ticks: { color: theme === 'dark' ? '#94a3b8' : '#334155', stepSize: 1 }, grid: { color: theme === 'dark' ? '#1e293b' : '#e2e8f0' } },
                y: { ticks: { color: theme === 'dark' ? '#94a3b8' : '#334155' }, grid: { display: false } }
              },
              plugins: { legend: { display: false } }
            }
          });
        }

        return () => {
          if (catChart) catChart.destroy();
          if (prioChart) prioChart.destroy();
          if (trendChart) trendChart.destroy();
          if (wardChart) wardChart.destroy();
        };
      }, [complaints, theme]);

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div>
              <h2 className="font-bold text-base text-slate-100">Municipal Analytics & Intelligence</h2>
              <p className="text-xs text-slate-400">Real-time metrics calculated from {complaints.length} actual civic records.</p>
            </div>
            <span className="text-xs font-semibold text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/30">
              Live BI Stream Synchronized
            </span>
          </div>

          {/* 4 Interactive Charts Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            {/* Chart 1 */}
            <div className={`p-5 rounded-3xl border ${theme === 'dark' ? 'glass-card-dark' : 'glass-card-light'}`}>
              <h3 className="font-bold text-sm text-slate-100 mb-1">Complaints by Category</h3>
              <p className="text-xs text-slate-400 mb-4">Distribution across infrastructure sectors</p>
              <div className="h-64">
                <canvas ref={catChartRef}></canvas>
              </div>
            </div>

            {/* Chart 2 */}
            <div className={`p-5 rounded-3xl border ${theme === 'dark' ? 'glass-card-dark' : 'glass-card-light'}`}>
              <h3 className="font-bold text-sm text-slate-100 mb-1">Priority Tier Distribution</h3>
              <p className="text-xs text-slate-400 mb-4">AI-classified urgency levels (0–100 rubric)</p>
              <div className="h-64">
                <canvas ref={prioChartRef}></canvas>
              </div>
            </div>

            {/* Chart 3 */}
            <div className={`p-5 rounded-3xl border ${theme === 'dark' ? 'glass-card-dark' : 'glass-card-light'}`}>
              <h3 className="font-bold text-sm text-slate-100 mb-1">Weekly Inflow vs Resolution Cadence</h3>
              <p className="text-xs text-slate-400 mb-4">Speed of municipal dispatch closing work orders</p>
              <div className="h-64">
                <canvas ref={trendChartRef}></canvas>
              </div>
            </div>

            {/* Chart 4 */}
            <div className={`p-5 rounded-3xl border ${theme === 'dark' ? 'glass-card-dark' : 'glass-card-light'}`}>
              <h3 className="font-bold text-sm text-slate-100 mb-1">Geographic Hotspots by Ward</h3>
              <p className="text-xs text-slate-400 mb-4">Complaint density per municipal zone</p>
              <div className="h-64">
                <canvas ref={wardChartRef}></canvas>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // Track Complaint Component
    // =========================================================================
    function TrackComplaintView({ complaints, onSelect, theme }) {
      const [lookupId, setLookupId] = useState('');
      const [foundIssue, setFoundIssue] = useState(complaints[0] || null);

      const handleSearch = (e) => {
        e.preventDefault();
        const trimmed = lookupId.trim().toUpperCase();
        const matched = complaints.find(c => c.id.toUpperCase() === trimmed || c.id.replace('-', '').toUpperCase() === trimmed);
        if (matched) {
          setFoundIssue(matched);
        } else {
          alert(`No complaint found with ID ${lookupId}`);
        }
      };

      const stages = ["Submitted", "AI Analyzed", "Assigned", "In Progress", "Resolved"];

      return (
        <div className="max-w-3xl mx-auto space-y-6">
          <div className="text-center space-y-2">
            <h2 className="text-2xl font-black tracking-tight text-slate-100">Track Civic Work Order</h2>
            <p className="text-xs text-slate-400">Enter your complaint tracking number (e.g. CP-101, CP-104) to view live field status.</p>
          </div>

          {/* Search Box */}
          <form onSubmit={handleSearch} className="flex items-center gap-2">
            <input
              type="text"
              placeholder="Enter Complaint ID (e.g. CP-101, CP-105)..."
              value={lookupId}
              onChange={(e) => setLookupId(e.target.value)}
              className="flex-1 px-4 py-3 rounded-2xl border text-sm bg-slate-900 border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono"
            />
            <button
              type="submit"
              className="px-6 py-3 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-md"
            >
              Track Now
            </button>
          </form>

          {/* Quick Suggestions */}
          <div className="flex items-center gap-2 text-xs text-slate-400">
            <span>Try sample IDs:</span>
            {['CP-101', 'CP-104', 'CP-105', 'CP-107', 'CP-116'].map(id => (
              <button
                key={id}
                onClick={() => {
                  const m = complaints.find(c => c.id === id);
                  if (m) setFoundIssue(m);
                }}
                className="px-2 py-1 rounded bg-slate-800 text-blue-400 font-mono font-bold hover:bg-slate-700"
              >
                {id}
              </button>
            ))}
          </div>

          {/* Found Issue Details */}
          {foundIssue && (
            <div className={`p-6 rounded-3xl border space-y-6 ${theme === 'dark' ? 'glass-card-dark' : 'glass-card-light'}`}>
              <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                <div>
                  <span className="font-mono text-xs font-bold text-blue-400 block mb-1">{foundIssue.id}</span>
                  <h3 className="font-black text-lg text-slate-100">{foundIssue.title}</h3>
                  <p className="text-xs text-slate-400 mt-1">📍 {foundIssue.location.address} ({foundIssue.location.ward})</p>
                </div>
                <div className="flex flex-col items-end gap-1.5">
                  <PriorityBadge tier={foundIssue.priority.tier} score={foundIssue.priority.score} />
                  <span className="text-[11px] text-slate-400 font-medium">SLA: {foundIssue.action_plan.sla_hours}h</span>
                </div>
              </div>

              {/* 5-Stage Visual Progress Tracker */}
              <div>
                <h4 className="text-xs font-bold text-slate-300 mb-3">Live Municipal Lifecycle Tracker</h4>
                <div className="grid grid-cols-5 gap-2">
                  {stages.map((st, idx) => {
                    const currentIdx = stages.indexOf(foundIssue.status);
                    const isCompleted = idx <= currentIdx;
                    const isCurrent = idx === currentIdx;

                    return (
                      <div key={st} className="flex flex-col items-center text-center">
                        <div className={`w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs mb-1.5 transition-all ${
                          isCompleted
                            ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30'
                            : 'bg-slate-800 text-slate-500 border border-slate-700'
                        } ${isCurrent ? 'ring-2 ring-blue-400 ring-offset-2 ring-offset-slate-900' : ''}`}>
                          {idx + 1}
                        </div>
                        <span className={`text-[10px] font-semibold ${isCompleted ? 'text-slate-200' : 'text-slate-500'}`}>
                          {st}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Department & First Response */}
              <div className="p-4 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-2 text-xs">
                <div className="flex items-center justify-between">
                  <span className="text-slate-400 font-semibold">Assigned Department:</span>
                  <span className="text-slate-200 font-bold">{foundIssue.department}</span>
                </div>
                <div>
                  <span className="text-slate-400 font-semibold block mb-0.5">Recommended Field Action:</span>
                  <p className="text-slate-300">{foundIssue.action_plan.first_response}</p>
                </div>
              </div>

              {/* Action Notes Timeline */}
              {foundIssue.action_notes && foundIssue.action_notes.length > 0 && (
                <div>
                  <h4 className="text-xs font-bold text-slate-300 mb-2">Internal Dispatch Log:</h4>
                  <div className="space-y-2 text-xs">
                    {foundIssue.action_notes.map((note, i) => (
                      <div key={i} className="p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300">
                        <div className="flex items-center justify-between text-[10px] text-slate-500 mb-1">
                          <strong className="text-blue-400">{note.author}</strong>
                          <span>{new Date(note.timestamp).toLocaleTimeString()}</span>
                        </div>
                        <p>{note.note}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Citizen feedback if resolved */}
              {foundIssue.status === 'Resolved' && (
                <div className="p-4 rounded-2xl bg-emerald-950/30 border border-emerald-500/30 text-xs space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="font-bold text-emerald-300 flex items-center gap-1.5">
                      <Icon name="check" className="w-4 h-4 text-emerald-400" />
                      Citizen Resolution Verification & Feedback
                    </span>
                    {foundIssue.citizen_feedback && (
                      <span className="text-amber-400 font-bold">
                        {'★'.repeat(foundIssue.citizen_feedback.rating)}
                      </span>
                    )}
                  </div>

                  {foundIssue.citizen_feedback ? (
                    <p className="text-slate-300 italic">"{foundIssue.citizen_feedback.comment}"</p>
                  ) : (
                    <form onSubmit={async (e) => {
                      e.preventDefault();
                      const ratingVal = Number(e.target.elements.rating.value) || 5;
                      const commentVal = e.target.elements.comment.value || 'Issue resolved satisfactorily.';
                      try {
                        const res = await fetch(`/api/complaints/${foundIssue.id}/feedback`, {
                          method: 'POST',
                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({ rating: ratingVal, comment: commentVal })
                        });
                        if (res.ok) {
                          const data = await res.json();
                          foundIssue.citizen_feedback = data.feedback;
                          alert('Thank you! Your feedback has been verified and recorded.');
                          e.target.reset();
                        }
                      } catch (err) {
                        alert('Failed to submit feedback.');
                      }
                    }} className="space-y-2.5">
                      <div className="flex items-center gap-2">
                        <span className="text-slate-300 font-semibold">Rate Work Quality:</span>
                        <select name="rating" defaultValue="5" className="px-2 py-1 rounded-lg bg-slate-900 border border-slate-700 text-amber-400 font-bold text-xs">
                          <option value="5">★★★★★ (5/5 Excellent)</option>
                          <option value="4">★★★★☆ (4/5 Good)</option>
                          <option value="3">★★★☆☆ (3/5 Average)</option>
                          <option value="2">★★☆☆☆ (2/5 Subpar)</option>
                          <option value="1">★☆☆☆☆ (1/5 Poor)</option>
                        </select>
                      </div>
                      <input
                        name="comment"
                        type="text"
                        placeholder="Write a brief comment on the repair..."
                        className="w-full px-3 py-1.5 rounded-xl border bg-slate-900 border-slate-700 text-slate-100 text-xs focus:ring-2 focus:ring-emerald-500"
                      />
                      <button
                        type="submit"
                        className="px-3.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs"
                      >
                        Submit Citizen Feedback
                      </button>
                    </form>
                  )}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // Explainable AI Modal Dialog
    // =========================================================================
    function ExplainableModal({ complaint, onClose, theme }) {
      const p = complaint.priority;
      const b = p.breakdown;

      // Escape key listener for WCAG keyboard accessibility
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [onClose]);

      return (
        <div
          role="dialog"
          aria-modal="true"
          aria-labelledby="modal-work-order-title"
          className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md"
        >
          <div className={`w-full max-w-2xl max-h-[90vh] overflow-y-auto rounded-3xl border shadow-2xl p-6 space-y-6 focus:outline-none ${
            theme === 'dark' ? 'bg-slate-900 border-slate-700 text-slate-100' : 'bg-white border-slate-300 text-slate-900'
          }`}>
            {/* Modal Header */}
            <div className="flex items-start justify-between border-b border-slate-800 pb-4">
              <div>
                <div className="flex items-center gap-2 mb-1">
                  <span className="font-mono text-xs font-bold text-blue-400">{complaint.id}</span>
                  <StatusBadge status={complaint.status} />
                  <PriorityBadge tier={p.tier} score={p.score} />
                </div>
                <h3 id="modal-work-order-title" className="text-lg font-black tracking-tight">{complaint.title}</h3>
                <p className="text-xs text-slate-400">📍 {complaint.location.address} ({complaint.location.ward})</p>
              </div>
              <button
                onClick={onClose}
                aria-label="Close modal dialog"
                className="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 focus:ring-2 focus:ring-blue-500"
              >
                <Icon name="close" className="w-5 h-5" />
              </button>
            </div>

            {/* Photo preview if present */}
            {complaint.photo_url && (
              <div className="rounded-2xl overflow-hidden h-48 w-full border border-slate-800 bg-slate-950">
                <img
                  src={complaint.photo_url}
                  alt={`Evidence photograph for work order ${complaint.id}: ${complaint.title}`}
                  className="w-full h-full object-cover"
                />
              </div>
            )}

            {/* Transparent 0-100 Rubric Meters */}
            <div>
              <h4 className="font-bold text-xs text-slate-300 mb-3 flex items-center justify-between">
                <span>Transparent AI Scoring Rubric Breakdown (0–100 Scale)</span>
                <span className="text-blue-400 font-bold">{p.score}/100 Total</span>
              </h4>

              <div className="space-y-2.5 text-xs">
                <div>
                  <div className="flex justify-between text-[11px] mb-1">
                    <span className="font-semibold text-slate-300">1. Public Safety & Hazard Severity (40%)</span>
                    <strong className="text-rose-400">{b.safety} / 40</strong>
                  </div>
                  <div
                    role="progressbar"
                    aria-valuenow={b.safety}
                    aria-valuemin="0"
                    aria-valuemax="40"
                    aria-label="Public Safety and Hazard Severity"
                    className="w-full h-2 rounded-full bg-slate-800 overflow-hidden"
                  >
                    <div className="h-full bg-rose-500 rounded-full" style={{ width: `${(b.safety / 40) * 100}%` }}></div>
                  </div>
                </div>

                <div>
                  <div className="flex justify-between text-[11px] mb-1">
                    <span className="font-semibold text-slate-300">2. Population Impact & Critical Infrastructure (25%)</span>
                    <strong className="text-amber-400">{b.impact} / 25</strong>
                  </div>
                  <div
                    role="progressbar"
                    aria-valuenow={b.impact}
                    aria-valuemin="0"
                    aria-valuemax="25"
                    aria-label="Population Impact and Facility Vulnerability"
                    className="w-full h-2 rounded-full bg-slate-800 overflow-hidden"
                  >
                    <div className="h-full bg-amber-500 rounded-full" style={{ width: `${(b.impact / 25) * 100}%` }}></div>
                  </div>
                </div>

                <div>
                  <div className="flex justify-between text-[11px] mb-1">
                    <span className="font-semibold text-slate-300">3. Corroboration & Duplicates Volume (20%)</span>
                    <strong className="text-blue-400">{b.corroboration} / 20</strong>
                  </div>
                  <div
                    role="progressbar"
                    aria-valuenow={b.corroboration}
                    aria-valuemin="0"
                    aria-valuemax="20"
                    aria-label="Report Corroboration and Duplicate Count"
                    className="w-full h-2 rounded-full bg-slate-800 overflow-hidden"
                  >
                    <div className="h-full bg-blue-500 rounded-full" style={{ width: `${(b.corroboration / 20) * 100}%` }}></div>
                  </div>
                </div>

                <div>
                  <div className="flex justify-between text-[11px] mb-1">
                    <span className="font-semibold text-slate-300">4. SLA Urgency & Time Decay (15%)</span>
                    <strong className="text-indigo-400">{b.decay} / 15</strong>
                  </div>
                  <div
                    role="progressbar"
                    aria-valuenow={b.decay}
                    aria-valuemin="0"
                    aria-valuemax="15"
                    aria-label="SLA Urgency and Risk Escalation"
                    className="w-full h-2 rounded-full bg-slate-800 overflow-hidden"
                  >
                    <div className="h-full bg-indigo-500 rounded-full" style={{ width: `${(b.decay / 15) * 100}%` }}></div>
                  </div>
                </div>
              </div>
            </div>

            {/* Explainable Rationale */}
            <div className="p-4 rounded-2xl bg-slate-950/80 border border-slate-800 space-y-2 text-xs">
              <strong className="text-slate-300 block">AI Explainability Rationale:</strong>
              <p className="text-slate-400 leading-relaxed">{p.rationale}</p>
            </div>

            {/* Recommended Action Plan */}
            <div className="p-4 rounded-2xl bg-slate-950/80 border border-slate-800 space-y-3 text-xs">
              <strong className="text-blue-400 block font-bold">Recommended Municipal Action Plan:</strong>
              <div>
                <span className="text-slate-400 font-semibold block">First Emergency Response:</span>
                <p className="text-slate-300 mt-0.5">{complaint.action_plan.first_response}</p>
              </div>

              <div>
                <span className="text-slate-400 font-semibold block mb-1">Required Specialized Equipment:</span>
                <div className="flex flex-wrap gap-1.5">
                  {complaint.action_plan.required_equipment.map((eq, i) => (
                    <span key={i} className="px-2 py-0.5 rounded-md bg-slate-800 text-[11px] text-slate-300 border border-slate-700">
                      {eq}
                    </span>
                  ))}
                </div>
              </div>

              <div className="pt-2 border-t border-slate-800 flex items-center justify-between">
                <span>Target SLA: <strong className="text-blue-400">{complaint.action_plan.sla_hours} Hours</strong></span>
                <span>Estimated Budget: <strong className="text-emerald-400">{complaint.action_plan.estimated_budget}</strong></span>
              </div>
            </div>

            {/* Close Button */}
            <div className="flex justify-end">
              <button
                onClick={onClose}
                className="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs"
              >
                Close Work Order
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Render the React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CivicPulseApp />);
  </script>
</body>
</html>
